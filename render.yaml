services:
  - type: web
    name: cloud-share-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: MONGODB_URI
        value: mongodb+srv://<username>:<password>@<cluster-url>/cloud_share?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-url.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://your-frontend-url.onrender.com
      - key: UPLOAD_DIR
        value: uploads
      - key: SERVER_MAX_FILE_SIZE
        value: 500MB
      - key: SERVER_MAX_REQUEST_SIZE
        value: 501MB
      - key: RAZORPAY_KEY_ID
        value: ""
      - key: RAZORPAY_KEY_SECRET
        value: ""
